spring:
  application:
    name: hangout-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hangout}
    username: ${DB_USER:hangout}
    password: ${DB_PASSWORD:hangout}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.hangout.api: INFO

hangout:
  # Public base URL of this API (used for upload URLs).
  public-url: ${PUBLIC_URL:http://localhost:8080}
  # Where the React app is served from; used in invite links and CORS.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  time-zone: ${TIME_ZONE:America/New_York}
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-at-least-32-bytes!!}
    ttl-hours: 24
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  demo-upgrade-enabled: ${DEMO_UPGRADE:true}
  free-searches-per-month: 3
  session-ttl-hours: 48
  google:
    # FR-DATA-3: when false the engine uses the seeded demo places and the fallback travel formula.
    enabled: ${GOOGLE_ENABLED:false}
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
    sign-in-client-id: ${GOOGLE_CLIENT_ID:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
  city:
    # Demo city: New York, East Village. Used when a typed address cannot be geocoded.
    center-lat: 40.7265
    center-lng: -73.9815
    sales-tax-rate: 0.08875
    tip-rate: 0.20
  engine:
    default-max-leg-minutes: 15
    walk-mph: 3
    transit-mph: 12
    car-mph: 20
    detour-factor: 1.3
    transit-fare-cents: 290
    rideshare-base-cents: 300
    rideshare-per-mile-cents: 200
    rideshare-per-minute-cents: 40
    car-cost-per-mile-cents: 30
    parking-per-stop-cents: 0
    hidden-gem-min-rating: 4.5
    hidden-gem-max-reviews: 200
